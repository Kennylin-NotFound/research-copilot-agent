name: ${PRODUCT_COMPOSE_PROJECT:-research-copilot}

x-product-app: &product-app
  image: ${PRODUCT_IMAGE:?Set an immutable image tag}
  env_file:
    - ${PRODUCT_APP_ENV_FILE:-.env.production}
  environment:
    PRODUCT_DATABASE_URL: postgresql://copilot:${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD}@db:5432/copilot
    PRODUCT_DATA_DIR: /var/lib/research-copilot
    PRODUCT_MODE: live
    PRODUCT_APP_ENV: production
    PRODUCT_APP_VERSION: ${PRODUCT_APP_VERSION:?Set PRODUCT_APP_VERSION}
    PRODUCT_COOKIE_SECURE: "true"
    PRODUCT_ALLOW_SETUP: "false"
    PRODUCT_ALLOWED_HOSTS: ${PRODUCT_ALLOWED_HOSTS:?Set PRODUCT_ALLOWED_HOSTS}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - product_storage:/var/lib/research-copilot
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD}
    volumes:
      - product_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 640m
    cpus: 0.6
    restart: unless-stopped

  api:
    <<: *product-app
    ports:
      - "127.0.0.1:${PRODUCT_HTTP_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3))['status']=='ok'"]
      interval: 10s
      timeout: 4s
      retries: 30
    mem_limit: 640m
    cpus: 0.5

  worker:
    <<: *product-app
    command: ["python", "-m", "product.worker"]
    healthcheck:
      disable: true
    mem_limit: 1536m
    cpus: 0.9

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      PRODUCT_PUBLIC_HOST: ${PRODUCT_PUBLIC_HOST:?Set PRODUCT_PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "${PRODUCT_PUBLIC_HTTP_PORT:-80}:80"
      - "${PRODUCT_PUBLIC_HTTPS_PORT:-443}:443"
      - "${PRODUCT_PUBLIC_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.2

volumes:
  product_pgdata:
  product_storage:
  caddy_data:
  caddy_config:
