name: rollback-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ROLLBACK to restore the previous deployed image
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirm == 'ROLLBACK' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PRODUCTION_TLS_MODE: ${{ vars.PRODUCTION_TLS_MODE }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Validate and configure SSH
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]
          [[ "$PRODUCTION_TLS_MODE" == "public" || "$PRODUCTION_TLS_MODE" == "internal" ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Restore previous deployment
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_ROOT=/opt/research-copilot bash /opt/research-copilot/current/scripts/server_rollback.sh"
      - name: Verify public service after rollback
        shell: bash
        run: |
          curl_tls=()
          if [[ "$PRODUCTION_TLS_MODE" == "internal" ]]; then
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              'proxy_id="$(docker ps --filter label=com.docker.compose.project=research-copilot --filter label=com.docker.compose.service=proxy --format "{{.ID}}" | head -n1)"; test -n "$proxy_id"; docker exec "$proxy_id" cat /data/caddy/pki/authorities/local/root.crt' \
              > /tmp/research-copilot-caddy-root.crt
            grep -q 'BEGIN CERTIFICATE' /tmp/research-copilot-caddy-root.crt
            curl_tls=(--cacert /tmp/research-copilot-caddy-root.crt)
          fi
          health="$(curl "${curl_tls[@]}" --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${PRODUCTION_URL%/}/health")"
          python3 - "$health" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data["status"] == "ok", data
          assert data["environment"] == "production", data
          assert data["mode"] == "live", data
          print(data["version"])
          PY
      - name: Remove short-lived registry credential
        if: always()
        shell: bash
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io >/dev/null 2>&1 || true" || true
