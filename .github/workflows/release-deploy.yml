name: release-and-deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: copilot_dev
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PRODUCT_DATABASE_URL: postgresql://copilot:test-only-password@127.0.0.1:15432/copilot_dev
      PRODUCT_DATA_DIR: .local/ci-storage
      PRODUCT_MODE: mock
      PRODUCT_COOKIE_SECURE: "false"
      PRODUCT_ALLOW_SETUP: "true"
      PRODUCT_ALLOWED_HOSTS: testserver
      PRODUCT_APP_ENV: development
      PRODUCT_APP_VERSION: release-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements.product.lock.txt
      - run: python -m unittest discover -s tests/product -v
      - run: python -m py_compile product/*.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node --check product/web/app.js && node --check product/web/rag.js

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      registry: ${{ steps.image.outputs.registry }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: image
        name: Validate and resolve registry image names
        shell: bash
        run: |
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$TCR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          [[ "$TCR_IMAGE" =~ ^[a-z0-9][a-z0-9.-]+/[a-z0-9._/-]+$ ]]
          [[ "$TCR_IMAGE" == "$TCR_REGISTRY/"* ]]
          {
            echo "ghcr=$ghcr_image"
            echo "name=$TCR_IMAGE"
            echo "registry=$TCR_REGISTRY"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ghcr }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: ${{ github.event.repository.visibility == 'public' }}
        name: Record GitHub artifact attestation for public repositories
        with:
          subject-name: ${{ steps.image.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PRODUCTION_TLS_MODE: ${{ vars.PRODUCTION_TLS_MODE }}
      DEPLOY_REGISTRY: ${{ needs.publish.outputs.registry }}
      DEPLOY_REGISTRY_TOKEN: ${{ secrets.TCR_PASSWORD }}
      DEPLOY_REGISTRY_USER: ${{ secrets.TCR_USERNAME }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      RELEASE_DIR: /opt/research-copilot/releases/${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate deployment inputs
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$PRODUCTION_URL"
          test -n "$DEPLOY_REGISTRY_TOKEN"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_REGISTRY_USER" =~ ^[A-Za-z0-9._@-]+$ ]]
          [[ "$DEPLOY_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          [[ "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]
          [[ "$PRODUCTION_TLS_MODE" == "public" || "$PRODUCTION_TLS_MODE" == "internal" ]]
          [[ "$IMAGE_REF" =~ ^[a-z0-9][a-z0-9.-]+/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
      - name: Configure pinned SSH host and deployment key
        shell: bash
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload immutable deployment bundle
        shell: bash
        run: |
          tar -czf /tmp/research-copilot-deploy.tgz \
            compose.production.yaml deploy/Caddyfile deploy/Caddyfile.ip \
            scripts/server_backup.sh scripts/server_deploy.sh scripts/server_restore_drill.sh \
            scripts/server_rollback.sh scripts/server_smoke.sh
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE_DIR'"
          scp -P "$DEPLOY_PORT" /tmp/research-copilot-deploy.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/research-copilot-deploy.tgz"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzf /tmp/research-copilot-deploy.tgz -C '$RELEASE_DIR' && rm -f /tmp/research-copilot-deploy.tgz && chmod 0750 '$RELEASE_DIR'/scripts/server_*.sh"
      - name: Pull exact regional registry digest and deploy
        shell: bash
        run: |
          printf '%s' "$DEPLOY_REGISTRY_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '$DEPLOY_REGISTRY' --username '$DEPLOY_REGISTRY_USER' --password-stdin"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_ROOT=/opt/research-copilot bash '$RELEASE_DIR/scripts/server_deploy.sh' '$IMAGE_REF' '${{ github.ref_name }}'"
      - name: Verify public HTTPS deployment
        shell: bash
        run: |
          ca_args=()
          if [[ "$PRODUCTION_TLS_MODE" == "internal" ]]; then
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              'proxy_id="$(docker ps --filter label=com.docker.compose.project=research-copilot --filter label=com.docker.compose.service=proxy --format "{{.ID}}" | head -n1)"; test -n "$proxy_id"; docker exec "$proxy_id" cat /data/caddy/pki/authorities/local/root.crt' \
              > /tmp/research-copilot-caddy-root.crt
            grep -q 'BEGIN CERTIFICATE' /tmp/research-copilot-caddy-root.crt
            ca_args=(/tmp/research-copilot-caddy-root.crt)
          fi
          bash scripts/server_smoke.sh "$PRODUCTION_URL" "${{ github.ref_name }}" "${ca_args[@]}"
      - name: Remove short-lived registry credential
        if: always()
        shell: bash
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker logout '$DEPLOY_REGISTRY' >/dev/null 2>&1 || true" || true
